# API endpoints, resource ids and CSV column mappings.
# ⚠️ PHASE 2 MANUAL STEP: after downloading the Kaggle CSV, replace the values
#    under csv_backfill.columns with the file's EXACT header names.

agmarknet:
  base_url: https://api.data.gov.in/resource
  resource_id_env: AGMARKNET_RESOURCE_ID
  api_key_env: DATA_GOV_IN_API_KEY
  page_limit: 1000
  max_pages: 200                 # hard stop so a paging bug cannot loop forever
  filters:
    state: Maharashtra
    commodity: Onion
  # Newer data.gov.in resources expect filters[state.keyword]=... instead of
  # filters[state]=... . If page 1 comes back empty we retry once with this
  # suffix appended to every filter key, and log a WARN saying we did.
  filter_key_fallback_suffix: ".keyword"
  # left = our canonical field, right = the field name in the API's JSON records
  api_columns:
    obs_date: arrival_date
    state: state
    district: district
    mandi: market
    commodity: commodity
    variety: variety
    grade: grade
    min_price: min_price
    max_price: max_price
    modal_price: modal_price
    arrival: arrivals
  date_format: "%d/%m/%Y"
  units:
    price: rupees_per_quintal
    arrival: quintal
  retry:
    attempts: 5
    backoff_seconds: [1, 2, 4, 8]

# ── data.gov.in daily forward feed (Phase A1) ───────────────────────────────
# The one source that keeps working every day. Supersedes the single-crop
# `agmarknet` block above: same endpoint, but it walks every crop in
# config/crops.yaml, writes each crop as it lands, and caches every page to
# disk so a throttle or a Ctrl-C costs us nothing we already fetched.
datagov:
  base_url: https://api.data.gov.in/resource
  resource_id_env: AGMARKNET_RESOURCE_ID
  api_key_env: DATA_GOV_IN_API_KEY
  page_limit: 1000
  max_pages: 200                 # hard stop so a paging bug cannot loop forever
  state: Maharashtra
  # null -> every crop in config/crops.yaml, filtered by its first alias.
  # Set an explicit list only if data.gov.in's commodity vocabulary disagrees
  # with ours; a wrong name yields 0 rows and a loud WARN, never bad rows.
  commodities: null
  # Newer resources expect filters[state.keyword]=... instead of filters[state]=.
  # If page 1 is empty we retry once with this suffix and log that we did.
  filter_key_fallback_suffix: ".keyword"
  # left = our canonical field, right = the field name in the API's JSON records
  api_columns:
    obs_date: arrival_date
    state: state
    district: district
    mandi: market
    commodity: commodity
    variety: variety
    grade: grade
    min_price: min_price
    max_price: max_price
    modal_price: modal_price
    arrival: arrivals
  date_format: "%d/%m/%Y"
  units:
    price: rupees_per_quintal
    arrival: quintal
  pause_seconds: 1.5             # be a good citizen between crops
  # Every page is written here before it is parsed. Re-running the same day
  # replays from disk instead of re-asking a public server for rows we have.
  cache_dir: data/artifacts/datagov_cache
  retry:
    attempts: 5
    backoff_seconds: [2, 5, 15, 45]
  # Anti-vacuity: a run where every crop came back empty is a failure, not a
  # quiet success. Silence from an upstream API looks exactly like "no market
  # activity today" unless we refuse to accept it.
  min_total_rows: 1

# ── CEDA Agri Market Data (Ashoka University) — the historical backbone ─────
# Reverse-engineered from the portal's own frontend calls. Two endpoints, both
# POST JSON: /api/prices gives p_min/p_max/p_modal, /api/quantities gives qty.
# Merged on (date, district) into one row per district per day.
#
# Granularity is district, not market — see the note in config/mandis.yaml.
# The server 504s on multi-year spans, so requests are chunked by year.
ceda:
  base_url: https://agmarknet.ceda.ashoka.edu.in
  prices_path: /api/prices
  quantities_path: /api/quantities
  state_id: 27                  # Maharashtra (census id)
  commodity_id: 23              # Onion
  calculation_type: d           # d = daily, m = monthly
  start_date: "2022-10-01"
  end_date: null                # null = today
  chunk_months: 6               # their nginx cuts every request off at 60s
  http_timeout_seconds: 90
  pause_seconds: 20             # they throttle hard under load — go slowly
  # Every successful window is cached here, so an interrupted or throttled pull
  # resumes instead of re-asking a public server for rows we already have.
  cache_dir: data/artifacts/ceda_cache
  retry:
    attempts: 4
    backoff_seconds: [30, 120, 300, 600]
  units:
    price: rupees_per_quintal
    arrival: quintal
  date_format: "%Y-%m-%d"

  # ── the catalogue, discovered by probing the live API (27 Aug 2026) ───────
  # CEDA echoes the commodity name back in every response, so these ids were
  # enumerated by asking for a monthly series and reading `cmdty` off the reply
  # rather than guessed. Verified against district 521 (Pune), which carries the
  # widest fruit-and-vegetable trade in the state.
  #
  # Left = our crop key in config/crops.yaml. Right = CEDA's commodity_id.
  # Crops marked (bonus) are not in crops.yaml yet — they cost nothing extra to
  # pull and give the global model more rows to borrow strength from.
  commodities:
    # our 14 configured crops
    onion: 23
    potato: 24
    garlic: 25
    tomato: 78
    brinjal: 35
    cauliflower: 34
    green_chilli: 87
    okra: 85            # CEDA calls it "Bhindi (Ladies Finger)"
    banana: 19
    mango: 20
    grapes: 22
    orange: 18
    pomegranate: 190
    # cabbage: not carried by CEDA under any id we could find — left out rather
    # than mapped to something close. A wrong mapping is worse than a gap.

    # bonus rows for the global model (all dense in Pune)
    apple: 17           # (bonus)
    pineapple: 21       # (bonus)
    papaya: 72          # (bonus)
    water_melon: 73     # (bonus)
    chikoo: 71          # (bonus)
    guava: 185          # (bonus)
    musk_melon: 187     # (bonus)
    bitter_gourd: 81    # (bonus)
    bottle_gourd: 82    # (bonus)
    pumpkin: 84         # (bonus)
    beans: 94           # (bonus)
    green_peas: 50      # (bonus)
    ginger_green: 103   # (bonus)
    coriander_leaves: 43  # (bonus)
    methi_leaves: 46    # (bonus)

  # ── Maharashtra districts (state_id 27), also probed live ────────────────
  # CEDA is DISTRICT granularity, not market: each row is the district's daily
  # aggregate across its market yards. One (district, crop) pair is therefore
  # one series, and the district name is used as the mandi name so it lines up
  # with the entries already in config/mandis.yaml.
  districts:
    Pune: 521           # widest crop list — 52 commodities, the anchor district
    Nashik: 516
    Ahmadnagar: 522
    Solapur: 526
    Kolhapur: 530
    Sangli: 531
    Satara: 527
    Aurangabad: 515
    Nagpur: 505
    Mumbai: 519
    Thane: 517
    Amravati: 503
    Buldana: 500
    Chandrapur: 509
    Osmanabad: 525
    Raigarh: 520

csv_backfill:
  # Written by scripts/merge_ceda_csv.py, which joins CEDA's separate price and
  # quantity exports into one row per market per day.
  path: data/raw/mandi_history.csv
  chunk_size: 100000
  # left  = our canonical field, right = column name in the source CSV
  columns:
    obs_date: obs_date
    state: state
    district: district
    mandi: mandi
    commodity: commodity
    variety: variety
    grade: grade
    min_price: min_price
    max_price: max_price
    modal_price: modal_price
    arrival: arrival_qtl
  units:
    price: rupees_per_quintal      # rupees_per_quintal | rupees_per_kg
    arrival: quintal               # quintal | tonne
  date_format: "%Y-%m-%d"

weather:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  forecast_url: https://api.open-meteo.com/v1/forecast
  # The archive and forecast endpoints both serve these. Soil moisture and ET0
  # come from the same call as the rain and temperature we were already asking
  # for, so the soil stream costs no extra requests.
  daily_vars:
    - precipitation_sum
    - temperature_2m_max
    - temperature_2m_min
    - soil_moisture_0_to_7cm_mean
    - soil_moisture_7_to_28cm_mean
    - soil_temperature_0_to_7cm_mean
    - et0_fao_evapotranspiration
  forecast_days: 16
  # The archive API lags real time by a few days; anything newer than this comes
  # from the forecast endpoint instead.
  archive_lag_days: 5

routing:
  osrm_url: http://router.project-osrm.org/route/v1/driving
  haversine_fallback_factor: 1.3
  coord_precision: 4               # decimals used for the distance_cache primary key

manual_files:
  shock_events: data/manual/shock_events.csv
  festivals: data/manual/festivals.csv

# ── entity resolution (Phase 2.4) ───────────────────────────────────────────
entity_resolution:
  auto_threshold: 95               # >= this  -> map silently
  review_threshold: 90             # 90..94   -> map, but write to fuzzy_review.csv
  min_prefix_tokens_chars: 4       # "Lasalgaon(Vinchur)" -> Lasalgaon needs >= 4 chars
  review_csv: data/artifacts/fuzzy_review.csv

# ── cleaning rules (Phase 2.3) ──────────────────────────────────────────────
# ⚠️ Never winsorise price spikes. A tripling onion price is real and is exactly
#    the event we want to predict. These rules only remove impossible values.
cleaning:
  min_modal_price: 10              # reject_nonpositive: modal <= this
  absurd_multiple: 20              # reject_absurd: modal > this x trailing median
  trailing_median_window: 90
  suspect_zscore: 6.0              # flag_suspect: |z| of daily log-return
  suspect_window: 30
  max_impute_gap_days: 3           # impute_gap: <= this many missing business days
  # One canonical series per (mandi, commodity): source rows that differ only by
  # variety/grade are merged into an arrival-weighted daily row. Downstream,
  # grade is applied as a price factor (Phase 5), not as a separate series.
  collapse_varieties: true

# ── audit verdict thresholds (Phase 2.8) ────────────────────────────────────
audit:
  report_path: data/artifacts/data_audit.md
  rejections_path: data/artifacts/rejections.json
  usable:
    min_rows: 500
    min_coverage: 0.60
  thin:
    min_rows: 200
    min_coverage: 0.35

ingestion:
  upsert_batch_size: 1000
  http_timeout_seconds: 30
