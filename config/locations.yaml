# Phase 10 — where a farmer says he is.
#
# Only the four districts we actually carry price data for. Offering a village in
# Kolhapur would be dishonest: we would take his registration and then have
# nothing to tell him. When CEDA's other twelve districts are pulled, add them
# here and the signup form widens on its own.
#
# Coordinates are village centroids to about three decimals. They feed road
# distance (ingestion/routing.py) and therefore transport cost, so a 2-3 km error
# moves a 60 km trip's cost by a few percent — good enough to rank markets,
# worth replacing with surveyed points before anyone quotes a rupee as exact.
#
# Villages were chosen as the well-known market-adjacent settlements in each
# taluka, so a farmer recognises his own or one within a few kilometres of it.

