# ── OTP (Phase 10) ──────────────────────────────────────────────────────────
otp:
  length: 6
  ttl_seconds: 600          # ten minutes, then it is dead
  max_attempts: 5           # wrong guesses before the code is burned
  resend_cooldown_seconds: 60
  rate_limit_per_hour: 10   # requests per phone number
  # Delivery. `log` prints the code to the server log and returns it in the
  # response, which is what a demo needs and what a production build must never
  # do — `whatsapp` becomes available in Phase 11 and the switch is this line.
  #   log      — dev: code is returned to the caller
  #   whatsapp — real delivery over the Meta Cloud API
  channel: log
